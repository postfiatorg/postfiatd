name: PR Check
on:
  pull_request:
    branches:
      - main
      - testnet
      - devnet
env:
  CONAN_HOME: /home/runner/.conan2
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes gcc-13 g++-13 libssl-dev libprotobuf-dev protobuf-compiler
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    - name: Install Conan
      run: pip install conan

    - name: Configure Conan profile
      run: conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: conan-${{ hashFiles('conanfile.py') }}
        restore-keys: conan-

    - name: Install dependencies
      run: |
        mkdir -p .build && cd .build
        conan install .. --output-folder . --build missing \
          --settings build_type=Release \
          --settings compiler.version=13 \
          --settings compiler.cppstd=20 \
          --settings compiler.libcxx=libstdc++11

    - name: Configure CMake
      run: |
        cd .build
        cmake \
          -DCMAKE_TOOLCHAIN_FILE:FILEPATH=build/generators/conan_toolchain.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -Dxrpld=ON \
          -Dtests=ON \
          ..

    - name: Build
      run: cmake --build .build -j $(nproc)

    - name: Manifest flood regressions
      run: |
        .build/postfiatd --unittest=ripple.overlay.manifest_flood
        .build/postfiatd --unittest=ripple.overlay.object_by_hash
        .build/postfiatd --unittest=ripple.app.Manifest
        .build/postfiatd --unittest=ripple.app.ValidatorList
        .build/postfiatd --unittest=ripple.overlay.compression
        .build/postfiatd --unittest=ripple.resource.ResourceManager

    - name: Upstream hardening regressions (1.0.7)
      run: |
        .build/postfiatd --unittest=ripple.protocol.STValidation
        .build/postfiatd --unittest=ripple.protocol.STObject
        .build/postfiatd --unittest=ripple.protocol.STParsedJSON
        .build/postfiatd --unittest=ripple.consensus.Consensus
        .build/postfiatd --unittest=ripple.app.LedgerReplay
        .build/postfiatd --unittest=ripple.app.SHAMapStore
        .build/postfiatd --unittest=ripple.overlay.reduce_relay
        .build/postfiatd --unittest=ripple.peerfinder.PeerFinder
        .build/postfiatd --unittest=beast.beast.IPEndpoint
